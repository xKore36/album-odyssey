<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101114" />
  <meta name="description" content="Um jogo pessoal de descoberta de álbuns." />
  <title>Album Odyssey</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="discover" aria-label="Ir para descobrir">
        <span class="brand-mark">AO</span>
        <span>
          <b>Album Odyssey</b>
          <small id="progressMini">0 / 500 ouvidos</small>
        </span>
      </button>
      <div class="top-actions">
        <span id="syncBadge" class="badge">modo local</span>
        <button id="accountBtn" class="icon-btn" title="Conta e sincronização">☁</button>
      </div>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button data-nav="discover" class="active"><span>🎲</span><small>Descobrir</small></button>
      <button data-nav="library"><span>▦</span><small>Biblioteca</small></button>
      <button data-nav="history"><span>◷</span><small>Histórico</small></button>
      <button data-nav="stats"><span>⌁</span><small>Stats</small></button>
    </nav>
  </div>

  <dialog id="ratingDialog" class="modal"></dialog>
  <dialog id="accountDialog" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./config.js"></script>
  <script src="./data/catalog.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
